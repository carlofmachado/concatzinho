# Colours in the working space: linear light, 1.0 the white of an SDR
# picture. A picture of one colour, and its middle pixel.

[[probe]]
name = "default"
input = [0.8, 0.5, 0.3, 1]
expect = [0.43896, 0.29297, 0.19141, 1]

[[probe]]
name = "minimum"
at = "min"
input = [0.8, 0.5, 0.3, 1]
expect = [0.79932, 0.49976, 0.30005, 1]

[[probe]]
name = "maximum"
at = "max"
input = [0.8, 0.5, 0.3, 1]
expect = [0.06482, 0.06573, 0.06647, 1]
