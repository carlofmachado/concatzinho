max = 100
default = 50
step = 1
unit = "%"

[[param]]
key = "cy"
label = "Centre Y"
min = 0
max = 100
default = 50
step = 1
unit = "%"

[[param]]
key = "radius"
label = "Start radius"
min = 0
max = 100
default = 0
step = 1
unit = "%"

[[param]]
key = "width"
label = "Width"
min = 0
max = 100
default = 8
step = 1
unit = "%"

[[param]]
key = "strength"
label = "Strength"
min = 0
max = 100
default = 35
step = 1
unit = "%"

[[param]]
key = "speed"
label = "Speed"
min = 0
max = 10
default = 1
step = 0.1

[wgsl]
entry = "effect.wgsl"
