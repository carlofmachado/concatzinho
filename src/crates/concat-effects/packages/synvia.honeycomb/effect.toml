format = 2

# Adapted from Drift by CutWire Studios (GPL-3.0-or-later),
# transitions/honeycomb_hexagon. See THIRD_PARTY_NOTICES.md.
[effect]
id = "synvia.honeycomb"
name = "Honeycomb"
kind = "transition"
category = "Mosaic"
order = 42
description = "Hexagons open cell by cell onto the next shot."

[[param]]
key = "density"
label = "Cells"
min = 4
max = 60
default = 18
step = 1

[[param]]
key = "stagger"
label = "Stagger"
min = 0
max = 100
default = 55
step = 1
unit = "%"

[[param]]
key = "softness"
label = "Edge softness"
min = 0.1
max = 20
default = 3
step = 0.1
unit = "%"

[transition]
entry = "effect.wgsl"
fallback = "cross-fade"
