# Colours in the working space: linear light, 1.0 the white of an SDR
# picture. A picture of one colour, and its middle pixel.

[[probe]]
name = "default"
input = [0.8, 0.5, 0.3, 1]
expect = [0.91406, 0.7627, 0.63574, 1]

[[probe]]
name = "minimum"
at = "min"
input = [0.8, 0.5, 0.3, 1]
expect = [0.79932, 0.49976, 0.30005, 1]

[[probe]]
name = "maximum"
at = "max"
input = [0.8, 0.5, 0.3, 1]
expect = [1, 0.92334, 0.78174, 1]
