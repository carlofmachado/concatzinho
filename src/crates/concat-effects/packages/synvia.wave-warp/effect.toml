format = 2

# Adapted from Drift by CutWire Studios (GPL-3.0-or-later),
# effects/wave_warp. See THIRD_PARTY_NOTICES.md.
[effect]
id = "synvia.wave-warp"
name = "Wave Warp"
kind = "effect"
category = "Distort"
order = 213
intensity = "amount"
description = "The picture ripples in a travelling sine wave."

[[param]]
key = "amount"
label = "Amount"
min = 0
max = 100
default = 35
step = 1
unit = "%"

[[param]]
key = "frequency"
label = "Frequency"
min = 1
max = 20
default = 6
step = 0.5

[[param]]
key = "speed"
label = "Speed"
min = 0
max = 400
default = 100
step = 1
unit = "%"

[[param]]
key = "axis"
label = "Direction"
type = "enum"
min = 0
max = 1
default = 0
values = [0, 1]
labels = ["Sideways", "Up and down"]

[wgsl]
entry = "effect.wgsl"
