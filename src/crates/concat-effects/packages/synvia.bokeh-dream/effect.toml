format = 2

# Adapted from Drift by CutWire Studios (GPL-3.0-or-later),
# effects/bokeh_dream. See THIRD_PARTY_NOTICES.md.
[effect]
id = "synvia.bokeh-dream"
name = "Bokeh Dream"
kind = "effect"
category = "Blur"
order = 204
intensity = "amount"
description = "The bright spots open into soft discs, like a lens wide open."

[[param]]
key = "amount"
label = "Amount"
min = 0
max = 100
default = 65
step = 1
unit = "%"

[[param]]
key = "radius"
label = "Radius"
min = 1
max = 24
default = 10
step = 1
unit = "px"

[[param]]
key = "threshold"
label = "Threshold"
min = 0
max = 100
default = 55
step = 1
unit = "%"

[[param]]
key = "softness"
label = "Softness"
min = 0
max = 100
default = 50
step = 1
unit = "%"

[wgsl]
entry = "effect.wgsl"
