format = 2

# Adapted from Drift by CutWire Studios (GPL-3.0-or-later),
# effects/block_glitch. See THIRD_PARTY_NOTICES.md.
[effect]
id = "synvia.block-glitch"
name = "Block Glitch"
kind = "effect"
category = "Glitch"
order = 208
intensity = "amount"
description = "Square blocks of the picture slip sideways out of place."

[[param]]
key = "amount"
label = "Amount"
min = 0
max = 100
default = 35
step = 1
unit = "%"

[[param]]
key = "size"
label = "Block size"
min = 4
max = 128
default = 32
step = 1
unit = "px"

[[param]]
key = "shift"
label = "Shift"
min = 0
max = 100
default = 24
step = 1
unit = "px"

[[param]]
key = "frequency"
label = "Frequency"
min = 0
max = 100
default = 25
step = 1
unit = "%"

[[param]]
key = "seed"
label = "Seed"
min = 0
max = 999
default = 1
step = 1

[wgsl]
entry = "effect.wgsl"
