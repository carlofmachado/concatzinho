format = 2

# Adapted from Drift by CutWire Studios (GPL-3.0-or-later),
# transitions/ink_bleed. See THIRD_PARTY_NOTICES.md.
[effect]
id = "synvia.ink-bleed"
name = "Ink Bleed"
kind = "transition"
category = "Dissolve"
order = 31
description = "Three drops of ink spread into each other and soak the next shot in."

[[param]]
key = "scale"
label = "Noise scale"
min = 1
max = 20
default = 6
step = 1

[[param]]
key = "distort"
label = "Distortion"
min = 0
max = 100
default = 55
step = 1
unit = "%"

[[param]]
key = "darkness"
label = "Ink darkness"
min = 0
max = 100
default = 70
step = 1
unit = "%"

[[param]]
key = "softness"
label = "Softness"
min = 0.5
max = 30
default = 4
step = 0.5
unit = "%"

[[param]]
key = "ink"
label = "Ink colour"
type = "color"
min = 0
max = 4294967295
default = 168235263

[transition]
entry = "effect.wgsl"
fallback = "cross-fade"
