format = 2

# Adapted from Drift by CutWire Studios (GPL-3.0-or-later),
# effects/scanline_glitch. See THIRD_PARTY_NOTICES.md.
[effect]
id = "synvia.scanline-glitch"
name = "Scanline Glitch"
kind = "effect"
category = "Glitch"
order = 206
description = "Lines of the picture jitter and tear sideways, with a split of colour."

[[param]]
key = "jitter"
label = "Jitter"
min = 0
max = 100
default = 25
step = 1
unit = "%"

[[param]]
key = "lines"
label = "Scanlines"
min = 0
max = 100
default = 35
step = 1
unit = "%"

[[param]]
key = "shift"
label = "Colour shift"
min = 0
max = 20
default = 4
step = 1
unit = "px"

[[param]]
key = "speed"
label = "Speed"
min = 0
max = 10
default = 2
step = 0.1

[wgsl]
entry = "effect.wgsl"
